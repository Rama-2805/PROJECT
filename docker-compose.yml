# SmartCampus AI — Production Docker Compose
# Enterprise deployment: Web, API, AI Engine, Edge Simulator, PostgreSQL, Redis, MQTT, MinIO

version: "3.9"

networks:
  smartcampus-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  minio-config:
    driver: local
  mqtt-data:
    driver: local
  ai-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ─── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }
        reservations: { cpus: "0.5", memory: "512M" }

  # ─── Cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartcampus-redis
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-smartcampus}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1", memory: "512M" }

  # ─── Message Broker ────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smartcampus-mqtt
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - mqtt-data:/mosquitto/data
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Object Storage ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: smartcampus-minio
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartcampus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO password required}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Backend API ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: smartcampus-api
    restart: unless-stopped
    networks: [smartcampus-net]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ai-data:/app/uploads
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartcampus}:${POSTGRES_PASSWORD}@postgres:5432/smartcampus
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartcampus}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT refresh secret required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key required}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartcampus}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PORT: 4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: "1G" }
      replicas: ${API_REPLICAS:-1}

  # ─── Frontend ──────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: smartcampus-web
    restart: unless-stopped
    networks: [smartcampus-net]
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
      API_SECRET: ${API_SECRET}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: "512M" }
      replicas: ${WEB_REPLICAS:-1}

  # ─── AI Engine ─────────────────────────────────────────────────
  ai-engine:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: smartcampus-ai-engine
    restart: unless-stopped
    networks: [smartcampus-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      - ai-data:/app/data
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartcampus}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartcampus}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKEND_URL: http://api:4000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "4", memory: "4G" }
        reservations: { cpus: "1", memory: "1G" }

  # ─── AI Celery Worker ──────────────────────────────────────────
  ai-worker:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: smartcampus-ai-worker
    restart: unless-stopped
    networks: [smartcampus-net]
    depends_on:
      redis: { condition: service_healthy }
      ai-engine: { condition: service_started }
    volumes:
      - ai-data:/app/data
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartcampus}@redis:6379
      BACKEND_URL: http://api:4000
    command: celery -A app.workers.enrollment_worker worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }
      replicas: ${WORKER_REPLICAS:-1}

  # ─── Edge Agent Simulator ──────────────────────────────────────
  edge-agent:
    build:
      context: ./apps/edge-agent
      dockerfile: Dockerfile
    container_name: smartcampus-edge-agent
    restart: unless-stopped
    networks: [smartcampus-net]
    depends_on:
      api: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    environment:
      PYTHONUNBUFFERED: 1
      BACKEND_URL: http://api:4000
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    profiles:
      - edge-simulator
    deploy:
      replicas: ${EDGE_REPLICAS:-0}

  # ─── Monitoring ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: smartcampus-prometheus
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: smartcampus-grafana
    restart: unless-stopped
    networks: [smartcampus-net]
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    profiles:
      - monitoring
