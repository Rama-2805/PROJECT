system:
  project_name: "SmartClassroom_Student_Enrollment"
  device: "auto"
  log_level: "INFO"
  checkpoint_file: "data/.checkpoint.json"

paths:
  raw_videos_dir: "footage"
  enrolled_students_dir: "data/enrolled_students"
  embeddings_dir: "embeddings"
  database_dir: "database"
  reports_dir: "reports"
  models_dir: "models"
  logs_dir: "logs"

frame_extraction:
  fps: 1.0

video_processing:
  extraction_mode: "fps"
  extraction_fps: 1.0
  supported_extensions: [".mp4", ".avi", ".mkv", ".mov"]
  verify_integrity: true

person_detection:
  model_name: "yolov8m.pt"
  conf_threshold: 0.40
  iou_threshold: 0.45
  target_classes: [0]

face_detection:
  model_name: "buffalo_l"
  det_thresh: 0.50
  det_size: [640, 640]
  padding: 0.15
  min_face_size: 60

quality_assessment:
  min_blur_score: 80.0
  min_tenengrad_score: 100.0
  min_brightness: 40.0
  max_brightness: 220.0
  min_sharpness: 30.0
  max_yaw_angle: 35.0
  max_pitch_angle: 25.0
  max_roll_angle: 30.0
  min_overall_quality: 0.55

duplicate_removal:
  enabled: true
  phash_threshold: 8
  ssim_threshold: 0.88
  cosine_similarity_threshold: 0.85

face_embeddings:
  model_name: "buffalo_l"
  embedding_dim: 512
  normalize: true

clustering:
  algorithm: "hdbscan"
  min_cluster_size: 8
  min_samples: 3
  cluster_selection_epsilon: 0.38

best_image_selection:
  min_images_per_student: 20
  max_images_per_student: 40

database:
  faiss_index_type: "IndexFlatIP"
  faiss_index_file: "database/faiss_index.bin"
  sqlite_db_file: "database/student_db.sqlite"

reports:
  export_json: true
  export_csv: true
  export_pdf: true
  json_filename: "reports/enrollment_report.json"
  csv_filename: "reports/enrollment_report.csv"
  pdf_filename: "reports/enrollment_report.pdf"
