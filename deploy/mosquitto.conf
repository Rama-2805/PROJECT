# SmartCampus AI — Mosquitto MQTT Broker Configuration
# Enterprise MQTT configuration with authentication and TLS support

# ─── Network ────────────────────────────────────────────────────
listener 1883
protocol mqtt

# TLS listener (uncomment and configure for production)
# listener 8883
# protocol mqtt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# cafile /etc/mosquitto/certs/ca.crt

# WebSocket listener
listener 9001
protocol websockets

# ─── Authentication ─────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/data/passwords
acl_file /mosquitto/data/acls

# ─── Security ──────────────────────────────────────────────────
require_certificate false
use_identity_as_username false

# ─── Persistence ────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# ─── Logging ────────────────────────────────────────────────────
log_dest file /mosquitto/data/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true

# ─── Limits ─────────────────────────────────────────────────────
max_connections 10000
max_inflight_messages 100
max_queued_messages 1000
queue_qos0_messages true

# ─── Topic Structure ───────────────────────────────────────────
# smartcampus/device/{deviceId}/heartbeat
# smartcampus/device/{deviceId}/attendance
# smartcampus/device/{deviceId}/behavior
# smartcampus/device/{deviceId}/logs
# smartcampus/device/{deviceId}/config
# smartcampus/device/{deviceId}/commands

# ─── ACL Rules ──────────────────────────────────────────────────
# Devices can publish to their own topics
# Backend can subscribe to all topics
# Admin can publish commands
