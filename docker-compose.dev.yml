# SmartCampus AI — Development Docker Compose
# Hot-reload enabled for local development

version: "3.9"

networks:
  dev-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  dev-postgres-data:
  dev-redis-data:
  dev-minio-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-dev-postgres
    restart: unless-stopped
    networks: [dev-net]
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcampus-dev-redis
    restart: unless-stopped
    networks: [dev-net]
    volumes:
      - dev-redis-data:/data
    command: redis-server --appendonly yes --requirepass smartcampus_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smartcampus-dev-mqtt
    restart: unless-stopped
    networks: [dev-net]
    ports:
      - "1883:1883"
      - "9001:9001"

  minio:
    image: minio/minio:latest
    container_name: smartcampus-dev-minio
    restart: unless-stopped
    networks: [dev-net]
    volumes:
      - dev-minio-data:/data
    environment:
      MINIO_ROOT_USER: smartcampus
      MINIO_ROOT_PASSWORD: smartcampus_dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9002:9001"

  ai-engine:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    image: smartcampus-ai-engine:latest
    container_name: smartcampus-dev-ai-engine
    restart: unless-stopped
    networks: [dev-net]
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ${INSIGHTFACE_MODEL_DIR:-~/.insightface/models}:/root/.insightface/models
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://:smartcampus_dev@redis:6379/0
      DATABASE_URL: postgresql://smartcampus:smartcampus_dev@postgres:5432/smartcampus
      BACKEND_API_URL: http://host.docker.internal:4000
      INTERNAL_API_KEY: sc-internal-service-key-dev-only
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
